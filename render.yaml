services:
  - type: web
    name: lifeos-api
    runtime: python
    plan: free
    region: ohio
    autoDeployTrigger: checksPass
    buildCommand: pip install -r requirements.txt
    preDeployCommand: alembic upgrade head
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: lifeos-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: CORS_ORIGINS
        value: https://lifeos-web.onrender.com
      - key: FRONTEND_URL
        value: https://lifeos-web.onrender.com

  - type: web
    name: lifeos-web
    runtime: static
    autoDeployTrigger: checksPass
    buildCommand: cd frontend && npm ci && npm run build
    staticPublishPath: frontend/dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        value: https://lifeos-api.onrender.com

databases:
  - name: lifeos-db
    plan: free
    region: ohio
    databaseName: lifeos
    user: lifeos
