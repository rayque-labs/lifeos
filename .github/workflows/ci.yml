name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -r requirements.txt
      - run: python -m pytest -q
      - run: alembic upgrade head
        env:
          DATABASE_URL: sqlite:///./ci-lifeos.db
          ENVIRONMENT: test
          JWT_SECRET: ci-only-secret-not-for-production-0000000000000000
      - run: alembic check
        env:
          DATABASE_URL: sqlite:///./ci-lifeos.db
          ENVIRONMENT: test
          JWT_SECRET: ci-only-secret-not-for-production-0000000000000000

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build
