name: Android debug APK

on:
  workflow_dispatch:
  push:
    branches: ['design/monolith-v2']
    paths:
      - 'frontend/**'
      - '.github/workflows/android-debug.yml'

permissions:
  contents: read

jobs:
  android:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Verify Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          test -d "$ANDROID_HOME"
      - name: Install frontend dependencies
        run: npm ci
      - name: Install Capacitor build tools
        run: npm install --no-save --package-lock=false @capacitor/core@^7 @capacitor/cli@^7 @capacitor/android@^7 @capacitor-community/sqlite@^7 @capacitor/local-notifications@^7
      - name: Build offline web app
        env:
          VITE_OFFLINE_MODE: 'true'
        run: npm run build
      - name: Generate Android project
        run: |
          rm capacitor.config.ts
          npm pkg set 'dependencies.@capacitor/core=^7' 'dependencies.@capacitor/android=^7' 'dependencies.@capacitor-community/sqlite=^7' 'dependencies.@capacitor/local-notifications=^7'
          npx cap add android
          npx cap sync android
          echo 'Checking native SQLite registration:'
          cat android/app/src/main/assets/capacitor.plugins.json
          grep -q 'CapacitorSQLite' android/app/src/main/assets/capacitor.plugins.json || { echo '::error::SQLite native plugin missing from Android registration'; exit 1; }
          grep -q 'LocalNotifications' android/app/src/main/assets/capacitor.plugins.json || { echo '::error::LocalNotifications native plugin missing from Android registration'; exit 1; }
      - name: Apply original LifeOS Android launcher icon
        run: |
          python -m pip install --quiet Pillow
          python - <<'PY'
          from pathlib import Path
          from PIL import Image, ImageOps
          source = Image.open('public/lifeos-original.png').convert('RGBA')
          base = Path('android/app/src/main/res')
          for density, size in [('mdpi',48),('hdpi',72),('xhdpi',96),('xxhdpi',144),('xxxhdpi',192)]:
              folder = base / ('mipmap-' + density)
              folder.mkdir(parents=True, exist_ok=True)
              icon = ImageOps.fit(source,(size,size),method=Image.Resampling.LANCZOS)
              for name in ('ic_launcher.png','ic_launcher_round.png'):
                  icon.save(folder/name)
              # Keep the original artwork in a safe inset for adaptive launcher masks.
              foreground_size = round(size * .72)
              emblem = ImageOps.fit(source,(foreground_size,foreground_size),method=Image.Resampling.LANCZOS)
              canvas = Image.new('RGBA',(size,size),(0,0,0,0))
              canvas.alpha_composite(emblem,((size-foreground_size)//2,(size-foreground_size)//2))
              canvas.save(folder/'ic_launcher_foreground.png')
          values = base/'values'
          values.mkdir(exist_ok=True)
          (values/'lifeos_launcher_background.xml').write_text('<resources><color name="lifeos_launcher_background">#000000</color></resources>')
          adaptive = base/'mipmap-anydpi-v26'
          adaptive.mkdir(exist_ok=True)
          for name in ('ic_launcher.xml','ic_launcher_round.xml'):
              (adaptive/name).write_text('<?xml version="1.0" encoding="utf-8"?><adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android"><background android:drawable="@color/lifeos_launcher_background"/><foreground android:drawable="@mipmap/ic_launcher_foreground"/></adaptive-icon>')
          PY
      - name: Enable Android immersive mode
        run: |
          cat > android/app/src/main/java/com/rayquelabs/lifeos/MainActivity.java <<'JAVA'
          package com.rayquelabs.lifeos;

          import android.os.Bundle;
          import android.view.View;
          import com.getcapacitor.BridgeActivity;

          public class MainActivity extends BridgeActivity {
            private void enableImmersiveMode() {
              getWindow().getDecorView().setSystemUiVisibility(
                View.SYSTEM_UI_FLAG_IMMERSIVE_STICKY
                | View.SYSTEM_UI_FLAG_FULLSCREEN
                | View.SYSTEM_UI_FLAG_HIDE_NAVIGATION
                | View.SYSTEM_UI_FLAG_LAYOUT_STABLE
                | View.SYSTEM_UI_FLAG_LAYOUT_FULLSCREEN
                | View.SYSTEM_UI_FLAG_LAYOUT_HIDE_NAVIGATION
              );
            }

            @Override
            public void onCreate(Bundle savedInstanceState) {
              super.onCreate(savedInstanceState);
              enableImmersiveMode();
            }

            @Override
            public void onWindowFocusChanged(boolean hasFocus) {
              super.onWindowFocusChanged(hasFocus);
              if (hasFocus) enableImmersiveMode();
            }
          }
          JAVA
      - name: Install native LifeOS alarm components
        run: |
          cp native-alarm/*.java android/app/src/main/java/com/rayquelabs/lifeos/
          python - <<'PY'
          from pathlib import Path
          p = Path('android/app/src/main/AndroidManifest.xml')
          s = p.read_text()
          s = s.replace('<application', '<uses-permission android:name="android.permission.VIBRATE" /><uses-permission android:name="android.permission.POST_NOTIFICATIONS" /><uses-permission android:name="android.permission.USE_FULL_SCREEN_INTENT" /><uses-permission android:name="android.permission.SCHEDULE_EXACT_ALARM" /><application', 1)
          s = s.replace('</application>', '<receiver android:name=".AlarmReceiver" android:exported="false" /><activity android:name=".AlarmActivity" android:exported="false" android:showWhenLocked="true" android:turnScreenOn="true" android:theme="@android:style/Theme.Material.NoActionBar" /></application>', 1)
          p.write_text(s)
          main = Path('android/app/src/main/java/com/rayquelabs/lifeos/MainActivity.java')
          s = main.read_text().replace('super.onCreate(savedInstanceState);', 'registerPlugin(LifeOSAlarmPlugin.class);\\n              super.onCreate(savedInstanceState);')
          s = s.replace('\\n', '\n')
          main.write_text(s)
          PY
      - name: Build debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: lifeos-monolith-debug-apk
          path: frontend/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
