name: Android debug APK

on:
  workflow_dispatch:
  push:
    branches: ['design/monolith-v2']
    paths:
      - 'frontend/**'
      - '.github/workflows/android-debug.yml'

permissions:
  contents: read

jobs:
  android:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Verify Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          test -d "$ANDROID_HOME"
      - name: Install frontend dependencies
        run: npm ci
      - name: Install Capacitor build tools
        run: npm install --no-save --package-lock=false @capacitor/core@^7 @capacitor/cli@^7 @capacitor/android@^7 @capacitor-community/sqlite@^7 @capacitor/local-notifications@^7
      - name: Build offline web app
        env:
          VITE_OFFLINE_MODE: 'true'
        run: npm run build
      - name: Generate Android project
        run: |
          rm capacitor.config.ts
          npm pkg set 'dependencies.@capacitor/core=^7' 'dependencies.@capacitor/android=^7' 'dependencies.@capacitor-community/sqlite=^7' 'dependencies.@capacitor/local-notifications=^7'
          npx cap add android
          npx cap sync android
          echo 'Checking native SQLite registration:'
          cat android/app/src/main/assets/capacitor.plugins.json
          grep -q 'CapacitorSQLite' android/app/src/main/assets/capacitor.plugins.json || { echo '::error::SQLite native plugin missing from Android registration'; exit 1; }
          grep -q 'LocalNotifications' android/app/src/main/assets/capacitor.plugins.json || { echo '::error::LocalNotifications native plugin missing from Android registration'; exit 1; }
      - name: Apply Monolith Android launcher icon
        run: |
          python -m pip install --quiet cairosvg
          python - <<'PY'
          from pathlib import Path
          import cairosvg
          source = Path('public/lifeos-symbol.svg').read_bytes()
          base = Path('android/app/src/main/res')
          for density, size in [('mdpi',48),('hdpi',72),('xhdpi',96),('xxhdpi',144),('xxxhdpi',192)]:
              folder = base / ('mipmap-' + density)
              folder.mkdir(parents=True, exist_ok=True)
              for name in ('ic_launcher.png','ic_launcher_round.png'):
                  cairosvg.svg2png(bytestring=source,write_to=str(folder/name),output_width=size,output_height=size)
              # Adaptive foreground: scale the emblem inside a transparent 108dp viewport.
              # A smaller centered emblem avoids Android launcher masks cropping the symbol.
              from PIL import Image
              import io
              emblem = Image.open(io.BytesIO(cairosvg.svg2png(bytestring=source,output_width=round(size*.68),output_height=round(size*.68)))).convert('RGBA')
              canvas = Image.new('RGBA',(size,size),(0,0,0,0))
              canvas.alpha_composite(emblem,((size-emblem.width)//2,(size-emblem.height)//2))
              canvas.save(folder/'ic_launcher_foreground.png')
          values = base/'values'
          values.mkdir(exist_ok=True)
          (values/'lifeos_launcher_background.xml').write_text('<resources><color name="lifeos_launcher_background">#101010</color></resources>')
          adaptive = base/'mipmap-anydpi-v26'
          adaptive.mkdir(exist_ok=True)
          for name in ('ic_launcher.xml','ic_launcher_round.xml'):
              (adaptive/name).write_text('<?xml version="1.0" encoding="utf-8"?><adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android"><background android:drawable="@color/lifeos_launcher_background"/><foreground android:drawable="@mipmap/ic_launcher_foreground"/></adaptive-icon>')
          PY
      - name: Enable Android immersive mode
        run: |
          cat > android/app/src/main/java/com/rayquelabs/lifeos/MainActivity.java <<'JAVA'
          package com.rayquelabs.lifeos;

          import android.os.Bundle;
          import android.view.View;
          import com.getcapacitor.BridgeActivity;

          public class MainActivity extends BridgeActivity {
            private void enableImmersiveMode() {
              getWindow().getDecorView().setSystemUiVisibility(
                View.SYSTEM_UI_FLAG_IMMERSIVE_STICKY
                | View.SYSTEM_UI_FLAG_FULLSCREEN
                | View.SYSTEM_UI_FLAG_HIDE_NAVIGATION
                | View.SYSTEM_UI_FLAG_LAYOUT_STABLE
                | View.SYSTEM_UI_FLAG_LAYOUT_FULLSCREEN
                | View.SYSTEM_UI_FLAG_LAYOUT_HIDE_NAVIGATION
              );
            }

            @Override
            public void onCreate(Bundle savedInstanceState) {
              super.onCreate(savedInstanceState);
              enableImmersiveMode();
            }

            @Override
            public void onWindowFocusChanged(boolean hasFocus) {
              super.onWindowFocusChanged(hasFocus);
              if (hasFocus) enableImmersiveMode();
            }
          }
          JAVA
      - name: Build debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: lifeos-monolith-debug-apk
          path: frontend/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
