name: Android diagnostic APK (minimal permissions)

on:
  workflow_dispatch:
  push:
    branches: ['design/monolith-v2']
    paths:
      - 'frontend/**'
      - '.github/workflows/android-debug.yml'

permissions:
  contents: read

jobs:
  android:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Verify Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          test -d "$ANDROID_HOME"
      - name: Install frontend dependencies
        run: npm ci
      - name: Install Capacitor and register native plugin dependencies
        run: |
          npm install --no-save --package-lock=false @capacitor/core@^7 @capacitor/cli@^7 @capacitor/android@^7 @capacitor-community/sqlite@^7 @capacitor/local-notifications@^7
          npm pkg set 'dependencies.@capacitor/core=^7' 'dependencies.@capacitor/android=^7' 'dependencies.@capacitor-community/sqlite=^7' 'dependencies.@capacitor/local-notifications=^7'
          npm pkg set 'devDependencies.@capacitor/cli=^7'
          node -e "const p=require('./package.json'); for(const n of ['@capacitor-community/sqlite','@capacitor/local-notifications']) if(!p.dependencies[n]) process.exit(1)"
      - name: Preflight frontend lint and dependency checks
        run: |
          npm run lint
          node - <<'JS'
          const fs = require('node:fs');
          const p = require('./package.json');
          for (const name of ['react', 'react-dom', 'vite', 'typescript']) {
            if (!(p.dependencies?.[name] || p.devDependencies?.[name])) throw Error('Missing dependency: ' + name);
          }
          for (const file of ['capacitor.config.ts', 'public/lifeos-original.png', 'src/components/GeminiConnectionSettings.tsx']) {
            if (!fs.existsSync(file)) throw Error('Missing required file: ' + file);
          }
          console.log('Frontend preflight OK');
          JS
      - name: Build offline web app
        env:
          VITE_OFFLINE_MODE: 'true'
        run: npm run build
      - name: Generate Android project
        run: |
          # Capacitor CLI v7 can fail to load TS config with newer TypeScript.
          # Use the equivalent JSON config during CI to avoid the CommonJS loader.
          test -f capacitor.config.ts
          python - <<'PY'
          import json
          from pathlib import Path
          config = {
              "appId": "com.rayquelabs.lifeos",
              "appName": "LifeOS",
              "webDir": "dist",
              "android": {"backgroundColor": "#101010"},
          }
          Path("capacitor.config.json").write_text(json.dumps(config, indent=2))
          Path("capacitor.config.ts").unlink()
          PY
          test -f capacitor.config.json
          python - <<'PY'
          import json
          from pathlib import Path
          c = json.loads(Path('capacitor.config.json').read_text())
          assert c['appId'] == 'com.rayquelabs.lifeos'
          assert c['webDir'] == 'dist'
          assert Path('dist/index.html').is_file()
          print('Capacitor JSON and offline web bundle OK')
          PY
          npx cap add android
          test -f android/gradlew
          npx cap sync android
          echo 'Checking native SQLite registration:'
          cat android/app/src/main/assets/capacitor.plugins.json
          grep -q 'CapacitorSQLite' android/app/src/main/assets/capacitor.plugins.json || { echo '::error::SQLite native plugin missing from Android registration'; exit 1; }
          grep -q 'LocalNotifications' android/app/src/main/assets/capacitor.plugins.json || { echo '::error::LocalNotifications native plugin missing from Android registration'; exit 1; }
      - name: Apply original LifeOS Android launcher icon
        run: |
          python -m pip install --quiet Pillow
          python - <<'PY'
          from pathlib import Path
          from PIL import Image, ImageOps
          source = Image.open('public/lifeos-original.png').convert('RGBA')
          base = Path('android/app/src/main/res')
          for density, size in [('mdpi',48),('hdpi',72),('xhdpi',96),('xxhdpi',144),('xxxhdpi',192)]:
              folder = base / ('mipmap-' + density)
              folder.mkdir(parents=True, exist_ok=True)
              icon = ImageOps.fit(source,(size,size),method=Image.Resampling.LANCZOS)
              for name in ('ic_launcher.png','ic_launcher_round.png'):
                  icon.save(folder/name)
              # Keep the original artwork in a safe inset for adaptive launcher masks.
              foreground_size = round(size * .72)
              emblem = ImageOps.fit(source,(foreground_size,foreground_size),method=Image.Resampling.LANCZOS)
              canvas = Image.new('RGBA',(size,size),(0,0,0,0))
              canvas.alpha_composite(emblem,((size-foreground_size)//2,(size-foreground_size)//2))
              canvas.save(folder/'ic_launcher_foreground.png')
          values = base/'values'
          values.mkdir(exist_ok=True)
          (values/'lifeos_launcher_background.xml').write_text('<resources><color name="lifeos_launcher_background">#000000</color></resources>')
          adaptive = base/'mipmap-anydpi-v26'
          adaptive.mkdir(exist_ok=True)
          for name in ('ic_launcher.xml','ic_launcher_round.xml'):
              (adaptive/name).write_text('<?xml version="1.0" encoding="utf-8"?><adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android"><background android:drawable="@color/lifeos_launcher_background"/><foreground android:drawable="@mipmap/ic_launcher_foreground"/></adaptive-icon>')
          PY
      - name: Validate Android XML resources
        run: |
          python - <<'PY'
          from pathlib import Path
          import xml.etree.ElementTree as ET
          base = Path('android/app/src/main')
          for p in [base/'AndroidManifest.xml', *base.joinpath('res').rglob('*.xml')]:
              try:
                  ET.parse(p)
              except ET.ParseError as error:
                  print(f'::error file={p}::Invalid XML: {error}')
                  raise
          print('All generated Android XML files parsed successfully')
          PY
      - name: Preflight native resources and plugin registration
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          base = Path('android/app/src/main')
          plugins = json.loads((base/'assets/capacitor.plugins.json').read_text())
          classes = ' '.join(str(x) for x in plugins)
          assert 'CapacitorSQLite' in classes, 'SQLite plugin missing'
          assert 'LocalNotifications' in classes, 'LocalNotifications plugin missing'
          for density in ('mdpi','hdpi','xhdpi','xxhdpi','xxxhdpi'):
              for icon in ('ic_launcher.png','ic_launcher_round.png','ic_launcher_foreground.png'):
                  assert (base/'res'/('mipmap-'+density)/icon).is_file(), f'Missing {density}/{icon}'
          for icon in ('ic_launcher.xml','ic_launcher_round.xml'):
              assert (base/'res/mipmap-anydpi-v26'/icon).is_file(), f'Missing adaptive icon: {icon}'
          print('Native plugins and launcher resources OK')
          PY
      - name: Verify merged APK manifest

        run: |
          cd android
          chmod +x gradlew
          ./gradlew :app:processDebugMainManifest --no-daemon --stacktrace 2>&1 | tee ../android-manifest-build.log
          test ${PIPESTATUS[0]} -eq 0
          find app/build/intermediates -name AndroidManifest.xml -path '*merged_manifests*' -print | head -5
      - name: Preflight Gradle compilation (without packaging APK)
        run: |
          cd android
          ./gradlew :app:compileDebugJavaWithJavac --no-daemon --stacktrace 2>&1 | tee ../android-compile-preflight.log
          test ${PIPESTATUS[0]} -eq 0
      - name: Build debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace 2>&1 | tee ../android-build.log
          test ${PIPESTATUS[0]} -eq 0
      - name: Upload diagnostic logs even when build fails
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lifeos-android-build-logs
          path: |
            frontend/android-build.log
            frontend/android-manifest-build.log
            frontend/android-compile-preflight.log
            frontend/android/app/build/outputs/logs/
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: lifeos-diagnostic-minimal-apk
          path: frontend/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
